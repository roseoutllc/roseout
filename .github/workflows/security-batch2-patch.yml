name: Security batch 2 patch

on:
  push:
    branches:
      - security/rpc-storage-abuse-hardening-2026-09-07

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/rpc-storage-abuse-hardening-2026-09-07
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused security patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          event = Path('app/api/events/[id]/tickets/route.ts')
          source = event.read_text()
          old = '''  const existing = await supabaseAdmin.from("event_tickets").select("public_token").eq("event_id", id).eq("attendee_email", email).neq("status", "void").order("created_at", { ascending: false }).limit(1).maybeSingle();
          if (existing.error) return NextResponse.json({ error: "Unable to check registration" }, { status: 500 });
          if (existing.data?.public_token) return NextResponse.json({ ticketUrl: `/tickets/${existing.data.public_token}`, existing: true });'''
          new = '''  const existing = await supabaseAdmin.from("event_tickets").select("public_token").eq("event_id", id).eq("attendee_email", email).neq("status", "void").order("created_at", { ascending: false }).limit(1).maybeSingle();
          if (existing.error) return NextResponse.json({ error: "Unable to check registration" }, { status: 500 });
          if (existing.data?.public_token) {
            // Never return an existing bearer ticket token to an unauthenticated caller
            // who merely knows the attendee email. Re-deliver it only to that email.
            await deliverEventTicket({
              attendeeName: name,
              email,
              phone: null,
              eventTitle: event.title,
              startsAt: event.starts_at,
              timezone: event.timezone || "America/New_York",
              ticketPath: `/tickets/${existing.data.public_token}`,
            }).catch(() => undefined);
            return NextResponse.json({ existing: true, message: "If a ticket exists for this email, it has been sent again." });
          }'''
          if old not in source:
              raise RuntimeError('event existing-ticket block changed; refusing unsafe patch')
          event.write_text(source.replace(old, new))

          for filename in ['app/api/team/social-outreach/route.ts', 'app/api/team/site-visits/route.ts']:
              p = Path(filename)
              s = p.read_text()
              old_ttl = 'createSignedUrl(data.path, 60 * 60 * 24 * 7)'
              if old_ttl in s:
                  s = s.replace(old_ttl, 'createSignedUrl(data.path, 15 * 60)')
                  p.write_text(s)

          package = Path('package.json')
          data = json.loads(package.read_text())
          script = data['scripts']['test:security-access']
          test_path = 'lib/security/__tests__/pii-and-abuse-boundaries.test.ts'
          if test_path not in script:
              data['scripts']['test:security-access'] = script + ' ' + test_path
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Security regression tests
        run: npm run test:security-access

      - name: Typecheck
        run: npm run typecheck

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json \
            'app/api/events/[id]/tickets/route.ts' \
            app/api/team/social-outreach/route.ts \
            app/api/team/site-visits/route.ts
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "security: protect ticket tokens and private evidence URLs"
          git push origin HEAD:security/rpc-storage-abuse-hardening-2026-09-07
