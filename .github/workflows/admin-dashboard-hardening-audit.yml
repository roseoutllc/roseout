name: Admin dashboard hardening audit

on:
  pull_request:
    paths:
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'components/admin/**'
      - 'lib/admin-*.ts'
      - 'scripts/audit-admin-dashboard.mjs'
      - 'scripts/audit-admin-demo-boundaries.mjs'
      - 'scripts/audit-admin-dashboard-security.mjs'
      - 'scripts/audit-admin-careers-pii.mjs'
      - 'scripts/audit-admin-beta-pii.mjs'
      - 'scripts/audit-admin-giveaway-pii.mjs'
      - '.github/workflows/admin-dashboard-hardening-audit.yml'
  push:
    branches: [main]
    paths:
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'components/admin/**'
      - 'lib/admin-*.ts'
      - 'scripts/audit-admin-dashboard.mjs'
      - 'scripts/audit-admin-demo-boundaries.mjs'
      - 'scripts/audit-admin-dashboard-security.mjs'
      - 'scripts/audit-admin-careers-pii.mjs'
      - 'scripts/audit-admin-beta-pii.mjs'
      - 'scripts/audit-admin-giveaway-pii.mjs'
      - '.github/workflows/admin-dashboard-hardening-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit admin routes
        run: node scripts/audit-admin-dashboard.mjs
      - name: Audit admin demo boundaries
        run: node scripts/audit-admin-demo-boundaries.mjs
      - name: Audit admin auth, IDOR, and service-role boundaries
        run: node scripts/audit-admin-dashboard-security.mjs
      - name: Audit careers PII and mutation boundaries
        run: node scripts/audit-admin-careers-pii.mjs
      - name: Audit beta PII and mutation boundaries
        run: node scripts/audit-admin-beta-pii.mjs
      - name: Audit giveaway PII and mutation boundaries
        run: node scripts/audit-admin-giveaway-pii.mjs
