name: AWS Credential Vault runtime sync

on:
  pull_request:
    paths:
      - '.github/workflows/aws-credential-vault-runtime-sync.yml'
      - 'lib/admin/credential-vault-runtime-source.ts'
      - 'lib/aws/admin-credential-vault.ts'
      - 'lib/microsoft-365/config.ts'
      - 'lib/microsoft-365/oauth.ts'
      - 'app/api/admin/settings/credentials/route.ts'
      - 'app/api/admin/integrations/microsoft-365/connect/route.ts'
      - 'app/api/admin/integrations/microsoft-365/callback/route.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-credential-vault-runtime-sync.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Credential Vault environment to reconcile
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: credential-vault-runtime-sync-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  CREDENTIAL_VAULT_PREFIX: /theouthaven/credential-vault

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single-source-of-truth contract
        run: |
          set -euo pipefail
          FILE='.github/workflows/aws-credential-vault-runtime-sync.yml'
          grep -F 'CREDENTIAL_VAULT_PREFIX' "$FILE" >/dev/null
          grep -F '${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}' "$FILE" >/dev/null
          grep -F 'MICROSOFT_CLIENT_SECRET' "$FILE" >/dev/null
          grep -F 'RESEND_API_KEY' "$FILE" >/dev/null
          grep -F 'TWILIO_AUTH_TOKEN' "$FILE" >/dev/null
          grep -F 'GOOGLE_PLACES_API_KEY' "$FILE" >/dev/null
          grep -F 'META_APP_SECRET' "$FILE" >/dev/null
          grep -F 'TIKTOK_CLIENT_SECRET' "$FILE" >/dev/null
          grep -F 'DOMAIN_PROVIDER_API_SECRET' "$FILE" >/dev/null
          ! grep -F '${{ secrets.MICROSOFT_CLIENT_SECRET }}' "$FILE"
          ! grep -F '${{ secrets.RESEND_API_KEY }}' "$FILE"
          ! grep -F '${{ secrets.TWILIO_AUTH_TOKEN }}' "$FILE"

  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Reconcile provider vault entries into AWS runtime compatibility secret
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in production|staging) ;; *) echo 'Invalid environment' >&2; exit 1 ;; esac
          RUNTIME_SECRET="/theouthaven/${TARGET_ENV}/edge-runtime/env"
          WORK="$RUNNER_TEMP/credential-vault-sync"
          mkdir -p "$WORK/providers"

          for provider in google supabase microsoft huggingface resend twilio meta tiktok apple domains; do
            secret_id="${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/${provider}"
            if ! aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text > "$WORK/providers/${provider}.json" 2>/dev/null; then
              printf '{}\n' > "$WORK/providers/${provider}.json"
            fi
            jq -e 'type == "object"' "$WORK/providers/${provider}.json" >/dev/null
          done

          if ! aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET" --query SecretString --output text > "$WORK/runtime.json" 2>/dev/null; then
            printf '{}\n' > "$WORK/runtime.json"
          fi
          jq -e 'type == "object"' "$WORK/runtime.json" >/dev/null

          python3 - "$WORK" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          runtime = json.loads((root / 'runtime.json').read_text())
          mapping = {
              'google': {
                  'apiKey': ['GOOGLE_PLACES_API_KEY', 'GOOGLE_GEOCODING_API_KEY'],
                  'clientId': ['GOOGLE_CLIENT_ID', 'GOOGLE_OAUTH_CLIENT_ID'],
                  'clientSecret': ['GOOGLE_CLIENT_SECRET', 'GOOGLE_OAUTH_CLIENT_SECRET'],
              },
              'supabase': {
                  'url': ['SUPABASE_URL'],
                  'publishableKey': ['NEXT_PUBLIC_SUPABASE_ANON_KEY'],
                  'serviceRoleKey': ['SUPABASE_SERVICE_ROLE_KEY'],
              },
              'microsoft': {
                  'tenantId': ['MICROSOFT_TENANT_ID'],
                  'clientId': ['MICROSOFT_CLIENT_ID'],
                  'clientSecret': ['MICROSOFT_CLIENT_SECRET'],
              },
              'huggingface': {'token': ['SEARCH_HF_ML_TOKEN', 'HF_TOKEN', 'HUGGINGFACE_TOKEN']},
              'resend': {'apiKey': ['RESEND_API_KEY']},
              'twilio': {'accountSid': ['TWILIO_ACCOUNT_SID'], 'authToken': ['TWILIO_AUTH_TOKEN']},
              'meta': {
                  'appId': ['META_APP_ID', 'FACEBOOK_APP_ID'],
                  'appSecret': ['META_APP_SECRET', 'FACEBOOK_APP_SECRET'],
                  'instagramAppId': ['INSTAGRAM_APP_ID'],
                  'instagramAppSecret': ['INSTAGRAM_APP_SECRET'],
                  'graphVersion': ['META_GRAPH_VERSION'],
                  'loginConfigurationId': ['META_LOGIN_CONFIGURATION_ID'],
                  'accessToken': ['META_ACCESS_TOKEN', 'FACEBOOK_ACCESS_TOKEN'],
              },
              'tiktok': {'clientKey': ['TIKTOK_CLIENT_KEY'], 'clientSecret': ['TIKTOK_CLIENT_SECRET']},
              'apple': {
                  'issuerId': ['APPLE_BUSINESS_API_CLIENT_ID'],
                  'keyId': ['APPLE_BUSINESS_API_KEY_ID'],
                  'privateKey': ['APPLE_BUSINESS_API_PRIVATE_KEY'],
              },
              'domains': {
                  'apiKey': ['DOMAIN_PROVIDER_API_KEY'],
                  'apiSecret': ['DOMAIN_PROVIDER_API_SECRET'],
                  'accountId': ['DOMAIN_PROVIDER_ACCOUNT_ID'],
              },
          }
          legacy_microsoft = [
              'M365_TENANT_ID', 'AZURE_TENANT_ID', 'M365_CLIENT_ID', 'AZURE_CLIENT_ID',
              'M365_CLIENT_SECRET', 'AZURE_CLIENT_SECRET', 'M365_PROVISIONING_CLIENT_ID',
              'M365_PROVISIONING_CLIENT_SECRET',
          ]
          for key in legacy_microsoft:
              runtime.pop(key, None)
          managed = {env for fields in mapping.values() for envs in fields.values() for env in envs}
          for key in managed:
              runtime.pop(key, None)
          configured = {}
          for provider, fields in mapping.items():
              values = json.loads((root / 'providers' / f'{provider}.json').read_text())
              count = 0
              for field, env_names in fields.items():
                  value = values.get(field)
                  if isinstance(value, str) and value.strip():
                      for env_name in env_names:
                          runtime[env_name] = value.strip()
                      count += 1
              configured[provider] = count
          (root / 'runtime-next.json').write_text(json.dumps(runtime, separators=(',', ':')))
          (root / 'summary.json').write_text(json.dumps(configured, separators=(',', ':')))
          PY

          aws secretsmanager put-secret-value --secret-id "$RUNTIME_SECRET" --secret-string "file://$WORK/runtime-next.json" >/dev/null
          jq -c 'to_entries | map({provider:.key,configuredFields:.value})' "$WORK/summary.json"
          rm -rf "$WORK"

      - name: Recycle AWS runtime consumers without exposing credentials
        if: ${{ (inputs.environment || 'production') == 'production' }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for fn in toh-production-integration-api toh-production-edge-runtime toh-production-background-runtime; do
            if ! aws lambda get-function-configuration --function-name "$fn" --query Environment --output json > "$RUNNER_TEMP/${fn}.json" 2>/dev/null; then
              echo "Skipping non-Lambda or unavailable consumer: $fn"
              continue
            fi
            jq --arg stamp "$stamp" '.Variables.CREDENTIAL_VAULT_REFRESH_AT=$stamp' "$RUNNER_TEMP/${fn}.json" > "$RUNNER_TEMP/${fn}.next.json"
            aws lambda update-function-configuration --function-name "$fn" --environment "file://$RUNNER_TEMP/${fn}.next.json" >/dev/null
            aws lambda wait function-updated --function-name "$fn"
            rm -f "$RUNNER_TEMP/${fn}.json" "$RUNNER_TEMP/${fn}.next.json"
          done

      - name: Verify canonical Microsoft values came from Credential Vault
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          MICROSOFT_SECRET="${CREDENTIAL_VAULT_PREFIX}/${TARGET_ENV}/microsoft"
          VAULT_FILE="$RUNNER_TEMP/microsoft.json"
          RUNTIME_FILE="$RUNNER_TEMP/runtime.json"
          aws secretsmanager get-secret-value --secret-id "$MICROSOFT_SECRET" --query SecretString --output text > "$VAULT_FILE"
          aws secretsmanager get-secret-value --secret-id "/theouthaven/${TARGET_ENV}/edge-runtime/env" --query SecretString --output text > "$RUNTIME_FILE"
          jq -e '(.tenantId | strings | length > 0) and (.clientId | strings | length > 0) and (.clientSecret | strings | length > 0)' "$VAULT_FILE" >/dev/null
          python3 - "$VAULT_FILE" "$RUNTIME_FILE" <<'PY'
          import json, sys
          vault = json.load(open(sys.argv[1]))
          runtime = json.load(open(sys.argv[2]))
          assert runtime.get('MICROSOFT_TENANT_ID') == vault.get('tenantId')
          assert runtime.get('MICROSOFT_CLIENT_ID') == vault.get('clientId')
          assert runtime.get('MICROSOFT_CLIENT_SECRET') == vault.get('clientSecret')
          for key in ('M365_TENANT_ID','AZURE_TENANT_ID','M365_CLIENT_ID','AZURE_CLIENT_ID','M365_CLIENT_SECRET','AZURE_CLIENT_SECRET','M365_PROVISIONING_CLIENT_ID','M365_PROVISIONING_CLIENT_SECRET'):
              assert key not in runtime
          PY
          rm -f "$VAULT_FILE" "$RUNTIME_FILE"
          echo 'Credential Vault is the Microsoft credential authority.'
