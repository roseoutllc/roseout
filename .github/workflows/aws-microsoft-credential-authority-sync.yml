name: AWS Microsoft credential authority sync

on:
  pull_request:
    paths:
      - '.github/workflows/aws-microsoft-credential-authority-sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-microsoft-credential-authority-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-microsoft-credential-authority-sync-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '742020474738'
  EAST_SUPABASE_REF: ftdsltatyqhtllyyefzp
  RUNTIME_SECRET_NAME: /theouthaven/production/edge-runtime/env
  RUNTIME_SECRET_REGION: us-east-1
  INTEGRATION_API_FUNCTION: toh-production-integration-api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow source
        run: |
          set -euo pipefail
          test -f .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'external_azure_client_id' .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'external_azure_url' .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'M365_CLIENT_SECRET' .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'AZURE_CLIENT_SECRET' .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'RUNTIME_PROVIDER_SECRET_ID' .github/workflows/aws-microsoft-credential-authority-sync.yml
          grep -q 'RUNTIME_PROVIDER_SECRET_REGION' .github/workflows/aws-microsoft-credential-authority-sync.yml

  sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN || 'arn:aws:iam::742020474738:role/TheOutHavenGitHubPlatformDeployRole' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve authoritative Microsoft identity from Virginia Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          test -n "$MICROSOFT_CLIENT_SECRET" || { echo 'Missing MICROSOFT_CLIENT_SECRET' >&2; exit 1; }
          echo "::add-mask::$MICROSOFT_CLIENT_SECRET"

          AUTH_FILE="$RUNNER_TEMP/east-auth.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${EAST_SUPABASE_REF}/config/auth" \
            > "$AUTH_FILE"

          AZURE_ENABLED="$(jq -r '.external_azure_enabled // false' "$AUTH_FILE")"
          MICROSOFT_CLIENT_ID="$(jq -r '.external_azure_client_id // empty' "$AUTH_FILE" | xargs)"
          AZURE_URL="$(jq -r '.external_azure_url // empty' "$AUTH_FILE" | xargs)"
          MICROSOFT_TENANT_ID="$(printf '%s' "$AZURE_URL" | sed -nE 's#^https://login\.microsoftonline\.com/([^/]+).*$#\1#p')"

          test "$AZURE_ENABLED" = 'true' || { echo 'Virginia Azure auth provider is not enabled' >&2; exit 1; }
          [[ "$MICROSOFT_CLIENT_ID" =~ ^[0-9A-Fa-f-]{36}$ ]] || { echo 'Virginia Azure client ID is missing or invalid' >&2; exit 1; }
          [[ "$MICROSOFT_TENANT_ID" =~ ^[0-9A-Fa-f-]{36}$ || "$MICROSOFT_TENANT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo 'Virginia Azure tenant ID is missing or invalid' >&2; exit 1; }
          echo "::add-mask::$MICROSOFT_CLIENT_ID"
          echo "::add-mask::$MICROSOFT_TENANT_ID"

          TOKEN_FILE="$RUNNER_TEMP/microsoft-token-check.json"
          HTTP_STATUS="$(curl --silent --show-error --output "$TOKEN_FILE" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$MICROSOFT_CLIENT_ID" \
            --data-urlencode "client_secret=$MICROSOFT_CLIENT_SECRET" \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'scope=https://graph.microsoft.com/.default' \
            "https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/token")"
          test "$HTTP_STATUS" = '200' || { echo 'Microsoft credential validation failed' >&2; jq -r '.error // "unknown_error"' "$TOKEN_FILE" >&2; exit 1; }
          jq -e '.access_token | strings | length > 20' "$TOKEN_FILE" >/dev/null
          rm -f "$TOKEN_FILE" "$AUTH_FILE"

          RUNTIME_FILE="$RUNNER_TEMP/runtime.json"
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNTIME_FILE"
          jq -e 'type == "object"' "$RUNTIME_FILE" >/dev/null

          jq \
            --arg tenant "$MICROSOFT_TENANT_ID" \
            --arg client "$MICROSOFT_CLIENT_ID" \
            --arg secret "$MICROSOFT_CLIENT_SECRET" \
            '. + {
              MICROSOFT_TENANT_ID:$tenant,
              MICROSOFT_CLIENT_ID:$client,
              MICROSOFT_CLIENT_SECRET:$secret
            }
            | del(
                .M365_TENANT_ID,
                .AZURE_TENANT_ID,
                .M365_CLIENT_ID,
                .AZURE_CLIENT_ID,
                .M365_CLIENT_SECRET,
                .AZURE_CLIENT_SECRET,
                .M365_PROVISIONING_CLIENT_ID,
                .M365_PROVISIONING_CLIENT_SECRET
              )' \
            "$RUNTIME_FILE" > "$RUNTIME_FILE.tmp"
          mv "$RUNTIME_FILE.tmp" "$RUNTIME_FILE"

          jq -e '
            (.MICROSOFT_TENANT_ID | strings | length > 0)
            and (.MICROSOFT_CLIENT_ID | strings | length == 36)
            and (.MICROSOFT_CLIENT_SECRET | strings | length > 0)
            and (has("M365_TENANT_ID") | not)
            and (has("AZURE_TENANT_ID") | not)
            and (has("M365_CLIENT_ID") | not)
            and (has("AZURE_CLIENT_ID") | not)
            and (has("M365_CLIENT_SECRET") | not)
            and (has("AZURE_CLIENT_SECRET") | not)
            and (has("M365_PROVISIONING_CLIENT_ID") | not)
            and (has("M365_PROVISIONING_CLIENT_SECRET") | not)
          ' "$RUNTIME_FILE" >/dev/null

          aws secretsmanager put-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --secret-string "file://$RUNTIME_FILE" >/dev/null
          rm -f "$RUNTIME_FILE"

      - name: Force Integration API onto Virginia runtime secret
        run: |
          set -euo pipefail
          ENVIRONMENT_JSON="$RUNNER_TEMP/integration-env.json"
          aws lambda get-function-configuration \
            --function-name "$INTEGRATION_API_FUNCTION" \
            --query Environment \
            --output json > "$ENVIRONMENT_JSON"
          jq -e '.Variables | type == "object"' "$ENVIRONMENT_JSON" >/dev/null
          jq \
            --arg secret_id "$RUNTIME_SECRET_NAME" \
            --arg secret_region "$RUNTIME_SECRET_REGION" \
            '.Variables.RUNTIME_PROVIDER_SECRET_ID=$secret_id
             | .Variables.RUNTIME_PROVIDER_SECRET_REGION=$secret_region' \
            "$ENVIRONMENT_JSON" > "$ENVIRONMENT_JSON.tmp"
          mv "$ENVIRONMENT_JSON.tmp" "$ENVIRONMENT_JSON"
          aws lambda update-function-configuration \
            --function-name "$INTEGRATION_API_FUNCTION" \
            --environment "file://$ENVIRONMENT_JSON" >/dev/null
          aws lambda wait function-updated --function-name "$INTEGRATION_API_FUNCTION"
          rm -f "$ENVIRONMENT_JSON"

      - name: Verify Integration API Virginia runtime wiring
        run: |
          set -euo pipefail
          LIVE_ENV="$RUNNER_TEMP/integration-live-env.json"
          aws lambda get-function-configuration \
            --function-name "$INTEGRATION_API_FUNCTION" \
            --query Environment.Variables \
            --output json > "$LIVE_ENV"
          jq -e \
            --arg secret_id "$RUNTIME_SECRET_NAME" \
            --arg secret_region "$RUNTIME_SECRET_REGION" \
            '.RUNTIME_PROVIDER_SECRET_ID == $secret_id
             and .RUNTIME_PROVIDER_SECRET_REGION == $secret_region' \
            "$LIVE_ENV" >/dev/null
          rm -f "$LIVE_ENV"
          echo 'Integration API is wired to the Virginia runtime provider secret.'

      - name: Verify Virginia Microsoft credential presence
        run: |
          set -euo pipefail
          RUNTIME_FILE="$RUNNER_TEMP/runtime-verify.json"
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_NAME" \
            --query SecretString \
            --output text > "$RUNTIME_FILE"
          jq -e '
            (.MICROSOFT_TENANT_ID | strings | length > 0)
            and (.MICROSOFT_CLIENT_ID | strings | length == 36)
            and (.MICROSOFT_CLIENT_SECRET | strings | length > 0)
            and (has("M365_TENANT_ID") | not)
            and (has("AZURE_TENANT_ID") | not)
            and (has("M365_CLIENT_ID") | not)
            and (has("AZURE_CLIENT_ID") | not)
            and (has("M365_CLIENT_SECRET") | not)
            and (has("AZURE_CLIENT_SECRET") | not)
            and (has("M365_PROVISIONING_CLIENT_ID") | not)
            and (has("M365_PROVISIONING_CLIENT_SECRET") | not)
          ' "$RUNTIME_FILE" >/dev/null
          rm -f "$RUNTIME_FILE"
          echo 'Virginia Microsoft credentials are configured, validated, and canonicalized.'
